<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>La Pizarra</title>
  <meta name="description" content="Análisis de partidos de las grandes ligas y combinadas sugeridas">
  <meta name="theme-color" content="#1F6B45" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D1B24" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <header class="cabecera">
    <div class="marca">
      <h1>La Pizarra</h1>
      <p id="estado-datos">Cargando datos…</p>
    </div>
    <button id="btn-actualizar" class="icono" aria-label="Actualizar datos" title="Actualizar datos">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
    </button>
  </header>

  <nav class="ligas" id="ligas" aria-label="Ligas"></nav>

  <main id="contenido" tabindex="-1"></main>

  <nav class="pestanas" aria-label="Secciones">
    <button data-vista="partidos" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path fill="currentColor" d="M12 7.5l3.3 2.4-1.3 3.9h-4l-1.3-3.9z"/></svg>
      Partidos
    </button>
    <button data-vista="combinadas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 5h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/><path stroke="currentColor" stroke-width="2" stroke-dasharray="2 2" d="M14 5v12"/></svg>
      Combinadas
    </button>
    <button data-vista="tablas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 5h16M4 10h16M4 15h16M4 20h16M9 5v15"/></svg>
      Tablas
    </button>
    <button data-vista="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      Ajustes
    </button>
  </nav>

  <dialog id="dialogo"></dialog>

  <script src="/modelo.js"></script>
  <script src="/ia.js"></script>
  <script src="/app.js"></script>
</body>
</html>
